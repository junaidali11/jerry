<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Index</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      background-image: url('https://i.ibb.co/W46Msq6D/new-1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
    }

    .nav {
      position: absolute;
      top: 10px;
      left: 10px;
    }

    button {
      display: block;
      margin-bottom: 10px;
      padding: 10px 20px;
      background-color: rgba(40, 167, 69, 0.85);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: rgba(30, 126, 52, 0.9);
    }

    .content {
      margin-left: 160px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      width: fit-content;
      border-radius: 10px;
      margin-top: 100px;
    }
  </style>
</head>
<body>

  <div class="nav">
    <button onclick="location.href='myself.html'">Myself</button>
    <button onclick="location.href='contact.html'">Contact</button>
    <button onclick="location.href='index.html'">Index</button>
  </div>

  <div class="content">
    <h1>Welcome to the Index Page</h1>
    <p>This is the main page. Use the buttons to navigate.</p>
  </div>

</body>
</html>
